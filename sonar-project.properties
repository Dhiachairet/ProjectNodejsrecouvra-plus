# SonarQube analysis (ISO/IEC 25010, 6.7 Maintainability). Run `npm run test:coverage` first so coverage is imported.
# The token is never stored here: pass it on the command line (-Dsonar.token=...) or in the SONAR_TOKEN variable.
sonar.projectKey=recouvra-plus
sonar.projectName=Recouvra+
sonar.sourceEncoding=UTF-8

sonar.sources=src,frontend/src,scripts
sonar.tests=tests
sonar.exclusions=**/node_modules/**,frontend/dist/**,coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Process bootstrap only (connect + listen), excluded from coverage like in jest.config.js
sonar.coverage.exclusions=src/server.js,src/config/db.js,scripts/**
